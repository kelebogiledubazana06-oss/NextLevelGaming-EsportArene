            <h1>Gamer Profile</h1>

            <font face="Arial" size="5"><strong>Create Gamer Account</strong></font>
              <br><br>
              
              <form action="profile.html" method="GET">
                <font face="Arial" size="3">
                  <label for="username">Gamer Tag / Username:</label><br>
                  <input type="text" id="username" name="username" required width="100%"><br><br>

                  <label for="email">Email Address:</label><br>
                  <input type="email" id="email" name="email" required><br><br>

                  <label for="phone">Phone Number:</label><br>
                  <input type="tel" id="phone" name="phone" required><br><br>

                  <label for="password">Password:</label><br>
                  <input type="password" id="password" name="password" required><br><br>

                  <label for="confirm-password">Confirm Password:</label><br>
                  <input type="password" id="confirm-password" name="confirm-password" required><br><br>

                  <input type="checkbox" id="terms" name="terms" required>
                  <label for="terms">I accept the Arena rules</label><br><br>

                  <input type="submit" value="Register Account">
                </font>
              </form>
